[uwsgi]
module = wsgi
socket = /tmp/tactification.sock
chown-socket = nginx:nginx
chmod-socket = 664
# Graceful shutdown on SIGTERM, see https://github.com/unbit/uwsgi/issues/849#issuecomment-118869386
hook-master-start = unix_signal:15 gracefully_kill_them_all
need-app = true
die-on-term = true
# For debugging and testing
show-config = true
req-logger = file:/tmp/reqlog
logger = file:/tmp/errlog
enable-threads = true
# Purge newsletter signups left unconfirmed for 48h+, once a day at 03:00.
# Cron runs in the master process, so it fires once regardless of worker count.
master = true
cron = 0 3 -1 -1 -1 python /var/www/purge_pending_subscribers.py
